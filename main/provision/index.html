<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Receiver Setup</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #f8fafc;
      --fg: #0c1324;
      --muted: #64748b;
      --primary: #0d9488;
      --primary-fg: #fff;
      --err: #e11d48;
      --ok: #10b981;
      --border: #e2e8f0;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.35);
      --radius: 0.625rem;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font:
        15px/1.4 "Be Vietnam Pro",
        system-ui,
        -apple-system,
        sans-serif;
      color: var(--fg);
    }

    body {
      min-height: 100%;
      background: linear-gradient(
        145deg,
        #f8fafc 0%,
        #e6f3f1 50%,
        #f0f5f4 100%
      );
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      top: -30%;
      right: -10%;
      width: 50%;
      height: 60%;
      background: radial-gradient(
        circle,
        rgba(13, 148, 136, 0.08) 0%,
        transparent 70%
      );
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 24px 22px;
      border-radius: calc(var(--radius) * 2.2);
      background: var(--glass);
      -webkit-backdrop-filter: blur(12px) saturate(170%);
      backdrop-filter: blur(12px) saturate(170%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 8px 32px rgba(12, 19, 36, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    @supports not (
      (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))
    ) {
      .card {
        background: rgba(255, 255, 255, 0.92);
      }
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .lng {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: calc(var(--radius) * 0.8);
      border: 1px solid var(--border);
      background: rgba(13, 148, 136, 0.06);
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
    }

    .lng:hover {
      background: rgba(13, 148, 136, 0.14);
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 18px;
      display: grid;
      gap: 4px;
    }

    .meta code {
      background: rgba(13, 148, 136, 0.06);
      padding: 1px 6px;
      border-radius: calc(var(--radius) * 0.6);
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 12px 0 4px;
    }

    .row {
      position: relative;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: calc(var(--radius) * 1.4);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85);
      font: inherit;
      color: inherit;
      outline: none;
      transition:
        border-color 0.15s,
        box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }

    .toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: calc(var(--radius) * 0.8);
      line-height: 1;
    }

    .toggle:hover {
      background: rgba(13, 148, 136, 0.06);
    }

    button.submit {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border-radius: calc(var(--radius) * 1.4);
      border: 0;
      background: var(--primary);
      color: var(--primary-fg);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(13, 148, 136, 0.25);
    }

    button.submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      min-height: 1.4em;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.err {
      color: var(--err);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.02em;
    }

    .recovery {
      display: none;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .recovery.show {
      display: block;
    }

    .recovery h2 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button.secondary {
      flex: 1;
      padding: 10px;
      border-radius: calc(var(--radius) * 1.4);
      border: 1px solid var(--border);
      background: rgba(13, 148, 136, 0.08);
      font: inherit;
      color: var(--primary);
      cursor: pointer;
    }

    button.secondary:hover {
      background: rgba(13, 148, 136, 0.14);
    }

    button.danger {
      background: rgba(225, 29, 72, 0.08);
      color: var(--err);
      border-color: rgba(225, 29, 72, 0.2);
    }

    button.danger:hover {
      background: rgba(225, 29, 72, 0.14);
    }

    button.secondary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <form class="card" id="f" autocomplete="off">
    <h1>
      <span data-i18n="tt">Receiver Setup</span>
      <button type="button" class="lng" id="lng">VI</button>
    </h1>
    <div class="meta">
      <div>
        <span data-i18n="ls">SoftAP</span> <code id="softap">loading…</code> ·
        <span data-i18n="lp">Public ID</span> <code id="pid">—</code>
      </div>
      <div>
        <span data-i18n="lb">Boot</span> <code id="boot">—</code> ·
        <span data-i18n="lr">Receiver</span> <code id="rtype">—</code>
      </div>
      <div>
        <span data-i18n="ly">Recovery</span> <code id="reason">—</code> ·
        <span data-i18n="lo">State</span> <code id="op">—</code>
      </div>
    </div>
    <label for="ssid" data-i18n="ss">Wi-Fi SSID</label>
    <div class="row">
      <input id="ssid" maxlength="64" required>
    </div>
    <label for="wpw" data-i18n="wp">Wi-Fi password</label>
    <div class="row">
      <input id="wpw" type="password" maxlength="128" required>
      <button type="button" class="toggle" data-for="wpw">Show</button>
    </div>
    <label for="uri" data-i18n="bu">MQTT broker URI</label>
    <div class="row">
      <input
        id="uri"
        class="mono"
        required
        maxlength="191"
        pattern="mqtts://.+"
        placeholder="mqtts://broker.example.com:8883"
        data-i18n-title="bt"
        title="Must start with mqtts://"
      >
    </div>
    <label for="mu" data-i18n="ml">MQTT username</label>
    <div class="row">
      <input id="mu" maxlength="64" required>
    </div>
    <label for="mp" data-i18n="mp">MQTT password</label>
    <div class="row">
      <input id="mp" type="password" maxlength="128" required>
      <button type="button" class="toggle" data-for="mp">Show</button>
    </div>
    <label for="tok" data-i18n="tk">Enrollment token</label>
    <div class="row">
      <input
        id="tok"
        class="mono"
        minlength="8"
        maxlength="128"
        required
        autocapitalize="off"
        autocomplete="off"
        spellcheck="false"
      >
    </div>
    <button type="submit" class="submit" id="go" data-i18n="gl">Save and Reboot</button>
    <div class="status" id="s"></div>
    <div class="recovery show" id="recov">
      <h2 data-i18n="ec">Existing configuration</h2>
      <div class="meta" id="nameLine">
        <span data-i18n="dn">Device name:</span> <code id="dname">—</code>
      </div>
      <div class="actions">
        <button type="button" class="secondary" id="retry" data-i18n="rt">Retry Current Config</button>
        <button type="button" class="secondary danger" id="reset" data-i18n="rs">Factory Reset</button>
      </div>
    </div>
  </form>
  <script>
    (function () {
      var $ = function (id) {
          return document.getElementById(id);
        },
        L = {
          en: {
            tt: "Receiver Setup",
            ls: "SoftAP",
            lp: "Public ID",
            lb: "Boot",
            lr: "Receiver",
            ly: "Recovery",
            lo: "State",
            ss: "Wi-Fi SSID",
            wp: "Wi-Fi password",
            bu: "MQTT broker URI",
            ml: "MQTT username",
            mp: "MQTT password",
            tk: "Enrollment token",
            gl: "Save and Reboot",
            ec: "Existing configuration",
            dn: "Device name:",
            rt: "Retry Current Config",
            rs: "Factory Reset",
            sh: "Show",
            hi: "Hide",
            bt: "Must start with mqtts://",
            ld: "loading…",
            sv: "Saving…",
            ok: "Device restarting…",
            pf: "Provision failed",
            ne: "Network error",
            ry: "Retrying…",
            re: "Resetting…",
            cf: "Erase the stored configuration and reboot?",
            na: "Not assigned",
            uk: "unknown",
            no: "NONE",
          },
          vi: {
            tt: "Cài đặt bộ thu",
            ls: "SoftAP",
            lp: "Public ID",
            lb: "Khởi động",
            lr: "Loại thu",
            ly: "Phục hồi",
            lo: "Trạng thái",
            ss: "SSID Wi-Fi",
            wp: "Mật khẩu Wi-Fi",
            bu: "URI MQTT broker",
            ml: "Tên đăng nhập MQTT",
            mp: "Mật khẩu MQTT",
            tk: "Mã đăng ký",
            gl: "Lưu và khởi động lại",
            ec: "Cấu hình hiện có",
            dn: "Tên thiết bị:",
            rt: "Thử lại cấu hình hiện tại",
            rs: "Khôi phục cài đặt gốc",
            sh: "Hiện",
            hi: "Ẩn",
            bt: "Phải bắt đầu bằng mqtts://",
            ld: "Đang tải…",
            sv: "Đang lưu…",
            ok: "Thiết bị đang khởi động lại…",
            pf: "Cấu hình thất bại",
            ne: "Lỗi mạng",
            ry: "Đang thử lại…",
            re: "Đang xóa…",
            cf: "Xóa cấu hình đã lưu và khởi động lại?",
            na: "Chưa gán",
            uk: "không rõ",
            no: "KHÔNG",
          },
        },
        cl = "en",
        statusData = null,
        isBusy = false,
        canRetry = false,
        set = function (msg, cls) {
          var s = $("s");
          s.textContent = msg;
          s.className = "status " + (cls || "");
        },
        busy = function (on) {
          isBusy = on;
          $("go").disabled = on;
          $("retry").disabled = on || !canRetry;
          $("reset").disabled = on;
        },
        t = function (k) {
          return (L[cl] && L[cl][k]) || L.en[k] || k;
        },
        storeLang = function (lang) {
          try {
            localStorage.setItem("lang", lang);
          } catch (e) {}
        },
        readLang = function () {
          try {
            return localStorage.getItem("lang");
          } catch (e) {
            return null;
          }
        };

      function applyText() {
        var nodes = document.querySelectorAll("[data-i18n]");
        var i;
        document.title = t("tt");
        $("lng").textContent = cl === "en" ? "VI" : "EN";
        for (i = 0; i < nodes.length; i += 1) {
          nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
        }
        nodes = document.querySelectorAll("[data-i18n-title]");
        for (i = 0; i < nodes.length; i += 1) {
          nodes[i].title = t(nodes[i].getAttribute("data-i18n-title"));
        }
      }

      function renderToggleLabels() {
        var toggles = document.querySelectorAll(".toggle");
        var i;
        for (i = 0; i < toggles.length; i += 1) {
          toggles[i].textContent = $(toggles[i].getAttribute("data-for")).type === "password" ? t("sh") : t("hi");
        }
      }

      function renderStatus() {
        if (!statusData) {
          $("softap").textContent = t("ld");
          $("pid").textContent = t("ld");
          $("boot").textContent = t("ld");
          $("rtype").textContent = t("ld");
          $("reason").textContent = t("ld");
          $("op").textContent = t("ld");
          $("dname").textContent = t("ld");
          $("nameLine").style.display = "none";
          canRetry = false;
          busy(isBusy);
          return;
        }
        $("softap").textContent = statusData.softap_ssid || t("uk");
        $("pid").textContent = statusData.public_id || t("na");
        $("boot").textContent = statusData.boot_state || t("uk");
        $("rtype").textContent = statusData.compiled_receiver_type || t("uk");
        $("reason").textContent = statusData.recovery_reason || t("uk");
        $("op").textContent = statusData.op_state || t("no");
        $("dname").textContent = statusData.device_name || "—";
        $("nameLine").style.display = statusData.device_name ? "" : "none";
        canRetry = Boolean(
          statusData.boot_state && statusData.boot_state !== "UNPROVISIONED"
        );
        busy(isBusy);
      }

      function setLang(lang) {
        cl = lang === "vi" ? "vi" : "en";
        document.documentElement.lang = cl;
        applyText();
        renderToggleLabels();
        renderStatus();
        storeLang(cl);
      }

      function parseResponse(response) {
        return response.text().then(function (text) {
          var data = null;
          if (text) {
            try {
              data = JSON.parse(text);
            } catch (e) {
              data = null;
            }
          }
          if (!response.ok) {
            throw new Error(
              (data && (data.message || data.error)) || text || t("ne")
            );
          }
          return data || {};
        });
      }

      function loadStatus() {
        fetch("/api/status", { cache: "no-store" })
          .then(parseResponse)
          .then(function (data) {
            statusData = data;
            renderStatus();
          })
          .catch(function () {
            set(t("ne"), "err");
          });
      }

      (function () {
        var toggles = document.querySelectorAll(".toggle");
        var i;
        for (i = 0; i < toggles.length; i += 1) {
          toggles[i].addEventListener("click", function () {
            var input = $(this.getAttribute("data-for"));
            input.type = input.type === "password" ? "text" : "password";
            renderToggleLabels();
          });
        }
      })();

      $("f").addEventListener("submit", function (e) {
        e.preventDefault();
        if (!$("f").reportValidity()) {
          return;
        }
        busy(true);
        set(t("sv"));
        fetch("/api/provision", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            schema_version: 1,
            wifi: { ssid: $("ssid").value.trim(), password: $("wpw").value },
            mqtt: {
              broker_uri: $("uri").value.trim(),
              username: $("mu").value.trim(),
              password: $("mp").value,
            },
            enrollment: { token: $("tok").value.trim() },
          }),
        })
          .then(parseResponse)
          .then(function () {
            set(t("ok"), "ok");
          })
          .catch(function (e2) {
            busy(false);
            set(e2.message || t("pf"), "err");
          });
      });

      $("retry").addEventListener("click", function () {
        busy(true);
        set(t("ry"));
        fetch("/api/retry", { method: "POST" })
          .then(parseResponse)
          .then(function () {
            set(t("ok"), "ok");
          })
          .catch(function (e2) {
            busy(false);
            set(e2.message || t("ne"), "err");
          });
      });

      $("reset").addEventListener("click", function () {
        if (!confirm(t("cf"))) {
          return;
        }
        busy(true);
        set(t("re"));
        fetch("/api/reset", { method: "POST" })
          .then(parseResponse)
          .then(function () {
            set(t("ok"), "ok");
          })
          .catch(function (e2) {
            busy(false);
            set(e2.message || t("ne"), "err");
          });
      });

      $("lng").addEventListener("click", function () {
        setLang(cl === "en" ? "vi" : "en");
      });

      setLang(readLang() || "en");
      loadStatus();
    })();
  </script>
</body>
</html>
