<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="ti">Receiver Setup</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #0c1324;
        --muted: #64748b;
        --primary: #0d9488;
        --primary-fg: #fff;
        --err: #e11d48;
        --ok: #10b981;
        --border: #e2e8f0;
        --glass: rgba(255, 255, 255, 0.72);
        --glass-border: rgba(255, 255, 255, 0.35);
        --radius: 0.625rem;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font:
          15px/1.4 "Be Vietnam Pro",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--fg);
      }

      body {
        min-height: 100%;
        background: linear-gradient(
          145deg,
          #f8fafc 0%,
          #e6f3f1 50%,
          #f0f5f4 100%
        );
        background-attachment: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      body::before {
        content: "";
        position: fixed;
        top: -30%;
        right: -10%;
        width: 50%;
        height: 60%;
        background: radial-gradient(
          circle,
          rgba(13, 148, 136, 0.08) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 24px 22px;
        border-radius: calc(var(--radius) * 2.2);
        background: var(--glass);
        -webkit-backdrop-filter: blur(12px) saturate(170%);
        backdrop-filter: blur(12px) saturate(170%);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 8px 32px rgba(12, 19, 36, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }

      @supports not (
        (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))
      ) {
        .card {
          background: rgba(255, 255, 255, 0.92);
        }
      }

      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .lng {
        font-size: 11px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: calc(var(--radius) * 0.8);
        border: 1px solid var(--border);
        background: rgba(13, 148, 136, 0.06);
        color: var(--muted);
        cursor: pointer;
        line-height: 1;
      }

      .lng:hover {
        background: rgba(13, 148, 136, 0.14);
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 18px;
      }

      .meta code {
        background: rgba(13, 148, 136, 0.06);
        padding: 1px 6px;
        border-radius: calc(var(--radius) * 0.6);
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 12px 0 4px;
      }

      .row {
        position: relative;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: calc(var(--radius) * 1.4);
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.85);
        font: inherit;
        color: inherit;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
      }

      .toggle {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        padding: 6px 8px;
        border-radius: calc(var(--radius) * 0.8);
        line-height: 1;
      }

      .toggle:hover {
        background: rgba(13, 148, 136, 0.06);
      }

      button.submit {
        margin-top: 18px;
        width: 100%;
        padding: 12px;
        border-radius: calc(var(--radius) * 1.4);
        border: 0;
        background: var(--primary);
        color: var(--primary-fg);
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(13, 148, 136, 0.25);
      }

      button.submit:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .status {
        margin-top: 14px;
        font-size: 13px;
        min-height: 1.4em;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.err {
        color: var(--err);
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.02em;
      }

      .recovery {
        display: none;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }

      .recovery.show {
        display: block;
      }

      .recovery h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button.secondary {
        flex: 1;
        padding: 10px;
        border-radius: calc(var(--radius) * 1.4);
        border: 1px solid var(--border);
        background: rgba(13, 148, 136, 0.08);
        font: inherit;
        color: var(--primary);
        cursor: pointer;
      }

      button.secondary:hover {
        background: rgba(13, 148, 136, 0.14);
      }

      button.danger {
        background: rgba(225, 29, 72, 0.08);
        color: var(--err);
        border-color: rgba(225, 29, 72, 0.2);
      }

      button.danger:hover {
        background: rgba(225, 29, 72, 0.14);
      }

      button.secondary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body>
    <form class="card" id="f" autocomplete="off">
      <h1>
        <span data-i18n="t">Receiver Setup</span
        ><button type="button" class="lng" id="lng">VI</button>
      </h1>
      <div class="meta">
        <div>
          <span data-i18n="ma">MAC</span> <code id="mac">loading…</code> ·
          <span data-i18n="pi">Public ID</span> <code id="pid">—</code>
        </div>
        <div>
          <span data-i18n="fv">Firmware</span> <code id="fw">—</code> ·
          <span data-i18n="sl">State</span> <code id="st">—</code>
        </div>
      </div>
      <label for="ssid" data-i18n="ss">Wi-Fi SSID</label>
      <div class="row"><input id="ssid" maxlength="32" required /></div>
      <label for="wpw" data-i18n="wp">Wi-Fi password</label>
      <div class="row">
        <input id="wpw" type="password" maxlength="63" required /><button
          type="button"
          class="toggle"
          data-for="wpw"
          data-i18n="sh"
        >
          Show
        </button>
      </div>
      <label for="uri" data-i18n="bu">MQTT broker URI</label>
      <div class="row">
        <input
          id="uri"
          class="mono"
          required
          pattern="mqtts://.+"
          placeholder="mqtts://broker.example.com:8883"
          data-i18n-title="bt"
          title="Must start with mqtts://"
        />
      </div>
      <label for="mu" data-i18n="ml">MQTT username</label>
      <div class="row"><input id="mu" required /></div>
      <label for="mp" data-i18n="mp">MQTT password</label>
      <div class="row">
        <input id="mp" type="password" required /><button
          type="button"
          class="toggle"
          data-for="mp"
          data-i18n="sh"
        >
          Show
        </button>
      </div>
      <label for="tok" data-i18n="tk">Enrollment token</label>
      <div class="row">
        <input
          id="tok"
          class="mono"
          minlength="8"
          maxlength="128"
          required
          autocapitalize="off"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button type="submit" class="submit" id="go" data-i18n="gl">
        Provision
      </button>
      <div class="status" id="s"></div>
      <div class="recovery show" id="recov">
        <h2 data-i18n="ra">Recovery actions</h2>
        <div class="meta" id="ssidLine">
          <span data-i18n="cs">Current SSID:</span> <code id="curSsid">—</code>
        </div>
        <div class="actions">
          <button
            type="button"
            class="secondary"
            id="retry"
            data-i18n="rt"
          >
            Retry connection
          </button>
          <button
            type="button"
            class="secondary danger"
            id="reset"
            data-i18n="rs"
          >
            Factory reset
          </button>
        </div>
      </div>
    </form>
    <script>
      (function () {
        var $ = function (id) {
            return document.getElementById(id);
          },
          L = {
            en: {
              ti: "Receiver Setup",
              ma: "MAC",
              pi: "Public ID",
              fv: "Firmware",
              sl: "State",
              t: "Receiver Setup",
              ss: "Wi-Fi SSID",
              wp: "Wi-Fi password",
              bu: "MQTT broker URI",
              ml: "MQTT username",
              mp: "MQTT password",
              tk: "Enrollment token",
              gl: "Provision",
              ec: "Existing configuration",
              ra: "Recovery actions",
              cs: "Current SSID:",
              rt: "Retry connection",
              rs: "Factory reset",
              sh: "Show",
              hi: "Hide",
              bt: "Must start with mqtts://",
              ld: "loading…",
              sv: "Saving…",
              ok: "Device restarting…",
              pf: "Provision failed",
              ne: "Network error",
              ry: "Retrying…",
              rk: "Retrying connection…",
              rf: "Connection retry did not complete. Recovery mode is available.",
              re: "Resetting…",
              cf: "Erase the stored configuration and reboot?",
            },
            vi: {
              ti: "Cài đặt bộ thu",
              ma: "MAC",
              pi: "Mã công khai",
              fv: "Phiên bản FW",
              sl: "Trạng thái",
              t: "Cài đặt bộ thu",
              ss: "SSID Wi-Fi",
              wp: "Mật khẩu Wi-Fi",
              bu: "URI MQTT broker",
              ml: "Tên đăng nhập MQTT",
              mp: "Mật khẩu MQTT",
              tk: "Mã đăng ký",
              gl: "Cấu hình",
              ec: "Cấu hình hiện có",
              ra: "Thao tác phục hồi",
              cs: "SSID hiện tại:",
              rt: "Thử lại",
              rs: "Khôi phục gốc",
              sh: "Hiện",
              hi: "Ẩn",
              bt: "Phải bắt đầu bằng mqtts://",
              ld: "Đang tải…",
              sv: "Đang lưu…",
              ok: "Đang khởi động lại…",
              pf: "Cấu hình thất bại",
              ne: "Lỗi mạng",
              ry: "Đang thử lại…",
              rk: "Đang thử kết nối lại…",
              rf: "Kết nối lại chưa thành công. Bạn vẫn có thể thử lại hoặc cấu hình mới.",
              re: "Đang xóa…",
              cf: "Xóa cấu hình và khởi động lại?",
            },
          },
          cl = "en",
          sd = null,
          canRetry = false,
          pendingAction = "",
          actionStatusAfter = 0,
          set = function (msg, cls) {
            var s = $("s");
            s.textContent = msg;
            s.className = "status " + (cls || "");
          },
          busy = function (on) {
            $("go").disabled = on;
            $("retry").disabled = on || !canRetry;
            $("reset").disabled = on;
          },
          t = function (k) {
            return L[cl][k] || L.en[k] || k;
          },
          rs = function () {
            if (!sd) {
              canRetry = false;
              $("mac").textContent = t("ld");
              $("pid").textContent = t("ld");
              $("fw").textContent = t("ld");
              $("st").textContent = t("ld");
              $("curSsid").textContent = t("ld");
              $("recov").className = "recovery show";
              $("ssidLine").style.display = "";
              busy(false);
              return;
            }
            $("mac").textContent = sd.mac_label || "?";
            $("pid").textContent = sd.public_id || "—";
            $("fw").textContent = sd.firmware_version || "?";
            $("st").textContent = sd.op_state || "UNPROVISIONED";
            canRetry = Boolean(sd.can_retry);
            $("recov").className = "recovery show";
            if (sd.wifi_ssid) {
              $("curSsid").textContent = sd.wifi_ssid;
              $("ssidLine").style.display = "";
            } else {
              $("curSsid").textContent = "—";
              $("ssidLine").style.display = "none";
            }
            busy(isBusy);
          },
          sl = function (l) {
            cl = l === "vi" ? "vi" : "en";
            document.documentElement.lang = cl;
            $("lng").textContent = cl === "en" ? "VI" : "EN";
            document.title = t("ti");
            document.querySelectorAll("[data-i18n]").forEach(function (e) {
              e.textContent = L[cl][e.dataset.i18n] || e.textContent;
            });
            document.querySelectorAll("[data-i18n-title]").forEach(function (e) {
              e.title = L[cl][e.dataset.i18nTitle] || e.title;
            });
            rs();
            try {
              localStorage.setItem("lang", cl);
            } catch (e) {}
          },
          loadStatus = function () {
            return fetch("/api/status")
              .then(function (r) {
                return r.json();
              })
              .then(function (j) {
                sd = j;
                rs();
                if (pendingAction && Date.now() >= actionStatusAfter) {
                  var action = pendingAction;
                  pendingAction = "";
                  actionStatusAfter = 0;
                  busy(false);
                  if (action === "retry") {
                    set(t("rf"), "err");
                  } else {
                    set("");
                  }
                }
                return j;
              });
          };
        sl(
          (function () {
            try {
              return localStorage.getItem("lang");
            } catch (e) {
              return null;
            }
          })() || "en",
        );
        loadStatus().catch(function () {});
        window.setInterval(function () {
          loadStatus().catch(function () {});
        }, 5000);
        $("lng").addEventListener("click", function () {
          sl(cl === "en" ? "vi" : "en");
        });
        document.querySelectorAll(".toggle").forEach(function (b) {
          b.addEventListener("click", function () {
            var i = $(b.dataset.for),
              p = i.type === "password";
            i.type = p ? "text" : "password";
            b.dataset.i18n = p ? "hi" : "sh";
            b.textContent = p ? t("hi") : t("sh");
          });
        });
        $("f").addEventListener("submit", function (e) {
          e.preventDefault();
          if (!$("f").reportValidity()) return;
          pendingAction = "provision";
          actionStatusAfter = Date.now() + 3000;
          busy(true);
          set(t("sv"));
          fetch("/api/provision", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              schema_version: 1,
              wifi: { ssid: $("ssid").value, password: $("wpw").value },
              mqtt: {
                broker_uri: $("uri").value,
                username: $("mu").value,
                password: $("mp").value,
              },
              enrollment: { token: $("tok").value },
            }),
          })
            .then(function (r) {
              return r.ok
                ? r.json()
                : r.json().then(function (j) {
                    throw new Error(j.error || t("pf"));
                  });
            })
            .then(function () {
              set(t("ok"), "ok");
            })
            .catch(function (e) {
              pendingAction = "";
              actionStatusAfter = 0;
              busy(false);
              set(e.message || t("ne"), "err");
            });
        });
        $("retry").addEventListener("click", function () {
          pendingAction = "retry";
          actionStatusAfter = Date.now() + 3000;
          busy(true);
          set(t("ry"));
          fetch("/api/retry", { method: "POST" })
            .then(function () {
              set(t("rk"), "ok");
            })
            .catch(function () {
              pendingAction = "";
              actionStatusAfter = 0;
              busy(false);
              set(t("ne"), "err");
            });
        });
        $("reset").addEventListener("click", function () {
          if (!confirm(t("cf"))) return;
          pendingAction = "reset";
          actionStatusAfter = Date.now() + 3000;
          busy(true);
          set(t("re"));
          fetch("/api/reset", { method: "POST" })
            .then(function () {
              set(t("ok"), "ok");
            })
            .catch(function () {
              pendingAction = "";
              actionStatusAfter = 0;
              busy(false);
              set(t("ne"), "err");
            });
        });
      })();
    </script>
  </body>
</html>
